# The main job for SGG

variables:
  med_cluster_id:
    description: Cluster ID for the given name 
    lookup:
      cluster: "radar-medium"
  # trigger_paused_status: 
  #   description: PAUSED OR UNPAUSED
  #   default: PAUSED
# reference this as: existing_cluster_id: ${var.med_cluster_id}


resources:
  jobs:
    gcob_gcds_products_job:
      name: gcob_gcds_products_job

      permissions:
        - level: CAN_MANAGE
          user_name: mattia.didone@rabobank.com
        - level: CAN_MANAGE
          user_name: casey.wong@rabobank.nl
        - level: CAN_MANAGE
          user_name: Lucija.Marjanovic@rabobank.nl

      health:
        rules:
          - metric: RUN_DURATION_SECONDS
            op: GREATER_THAN
            value: 3600

      schedule:
        quartz_cron_expression: 0 0 5 * * ?
        timezone_id: Europe/Amsterdam
        pause_status: ${var.BUNDLE_VAR_trigger_pause_status}

      email_notifications:
        on_failure:
          - shivam.rastogi@rabobank.com
          - fm.nl.utrecht.kycdataadmin@rabobank.com
        # on_duration_warning_threshold_exceeded:
        #   - shivam.rastogi@rabobank.com
        #   - fm.nl.utrecht.kycdataadmin@rabobank.com
      
      tasks:
        - task_key: gcob_gcds_products
          notebook_task:
            notebook_path: ../src/gcob_gcds_products_daily.py
          existing_cluster_id: ${var.med_cluster_id}

        - task_key: load_gcob_gcds_products_to_dataverse
          notebook_task:
            notebook_path: ../src/dataverse/load_gcob_gcds_products_to_dataverse.py
          existing_cluster_id: ${var.med_cluster_id}
          depends_on:
            - task_key: gcob_gcds_products
          
      queue:
        enabled: true
