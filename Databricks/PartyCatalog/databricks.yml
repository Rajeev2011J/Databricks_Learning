# This is a Databricks asset bundle definition for PartyCatalog.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: PartyCatalog


include:
  - variables.yml
#  - resources/catalog.yml
  - resources/schemas.yml
#  - resources/tables.yml
#  - dev/variable-overrides.json
#  - preprd/variable-overrides.json
#  - prod/variable-overrides.json

# requires 0.287.0 for 'Catalog' -> current 0.227.1

variables:
  catalog_name:
    description: "catalog_name"
    default: "wr_fj_parties_and_risk_assessment_dev"
    type: string

  radar_schema_grants:
    description: "radar_schema_grants"
    default: ""
    type: string

  catalog_owner:
    description: catalog_owner
    default: "reg-dev-global-wrkycif"
    type: string

  environment:  
    description: environment
    default: "dev"
    type: string

  workspacename: 
    description: workspacename
    default: dbws-wr-radar-dev
    type: string

  workspaceurl: 
    description: workspaceurl
    default: adb-3634536606298227.7.azuredatabricks.net/
    type: string



targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-3634536606298227.7.azuredatabricks.net
      #host: ${var.workspaceurl}



