# radarv1/pytest.ini
#
# Per-bundle pytest configuration for LOCAL single-bundle runs:
#   cd Databricks/radarv1
#   pytest
#
# For the full centralized suite (all bundles), run from Databricks/:
#   pytest                   (uses pyproject.toml automatically)
#   .\run_tests.ps1          (Windows)
#   ./run_tests.sh           (Linux / macOS / ADO CI)
#
# HOW THIS FILE INTERACTS WITH pyproject.toml
# --------------------------------------------
# When pytest is invoked from INSIDE radarv1/ this file takes effect.
# When pytest is invoked from Databricks/ the pyproject.toml takes effect
# and this file is ignored.
#
# This file points testpaths and pythonpath to BOTH the bundle-local
# directories AND the shared tests/ infrastructure one level up, so that
# `from utils.df_helpers import ...` and `from environment import ...` work
# when running the bundle in isolation.
#
# rootdir must be set to Databricks/ so conftest.py is discovered correctly.

[pytest]
# Run from Databricks/radarv1/ — discover tests here
testpaths = tests

# src/ for this bundle + shared infrastructure from the parent tests/ dir
pythonpath =
    src
    ../tests
    ../GCOB_Reportingv1/tests

# Import mode must match pyproject.toml to avoid namespace collisions
# when both configs are used on the same codebase
addopts =
    --tb=short
    -v
    --strict-markers
    --import-mode=importlib

# Tell pytest where the root conftest.py lives (one level up in tests/)
# This ensures environment.py and all shared fixtures are discovered
# even when running from inside radarv1/
# pytest will walk up until it finds pyproject.toml — but when running
# in isolation inside radarv1/ it stops at this ini file.
# The --rootdir override ensures conftest from tests/ is loaded:
# Run as: pytest --rootdir=.. (from radarv1/) to pick up shared conftest.
# Or just use run_tests.sh/ps1 from the Databricks/ root.
