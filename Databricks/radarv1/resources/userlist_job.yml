# The main job for the userlist

variables:
  med_cluster_id:
    description: Cluster ID for the given name 
    lookup:
      cluster: "radar-medium"
  # trigger_paused_status: 
  #   description: PAUSED OR UNPAUSED
  #   default: PAUSED
# reference this as: existing_cluster_id: ${var.med_cluster_id}


resources:
  jobs:
    userlist_job:
      name: userlist_job

      permissions:
        - level: CAN_MANAGE
          user_name: mattia.didone@rabobank.com
        - level: CAN_MANAGE
          user_name: lucija.marjanovic@rabobank.nl
        - level: CAN_MANAGE
          user_name: casey.wong@rabobank.nl

      health:
        rules:
          - metric: RUN_DURATION_SECONDS
            op: GREATER_THAN
            value: 3000

      schedule:
        quartz_cron_expression: 0 0 5 * * ?
        timezone_id: Europe/Amsterdam
        pause_status: ${var.BUNDLE_VAR_trigger_pause_status}

      email_notifications:
        on_failure:
          - mattia.didone@rabobank.com
          - fm.nl.utrecht.kycdataadmin@rabobank.com
        # on_duration_warning_threshold_exceeded:
        #   - mattia.didone@rabobank.com
        #   - fm.nl.utrecht.kycdataadmin@rabobank.com
          
      tasks:
        - task_key: userlist_createtable__daily
          notebook_task:
            notebook_path: ../src/userlist_createtable__daily.py
          existing_cluster_id: ${var.med_cluster_id}

        - task_key: load_userlist_to_dataverse
          notebook_task:
            notebook_path: ../src/dataverse/load_userlist_to_dataverse.py
          existing_cluster_id: ${var.med_cluster_id}
          depends_on:
            - task_key: userlist_createtable__daily
        
        - task_key: load_userteamregistry_from_dataverse
          notebook_task:
            notebook_path: ../src/load_userteamregistry_from_dataverse.py
          existing_cluster_id: ${var.med_cluster_id}
          depends_on:
            - task_key: load_userlist_to_dataverse
            
      queue:
        enabled: true