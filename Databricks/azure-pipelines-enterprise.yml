  # ==========================================================================
  - stage: Prod
    displayName: 'Production'
    pool:
      name: 'Shared-EU-Container-Linux-Python-S-Prod'
    dependsOn: [Build, Dev, Preprod]
    condition: and(eq(variables['Build.SourceBranchName'], 'main'), succeeded('Build'))
    variables:
