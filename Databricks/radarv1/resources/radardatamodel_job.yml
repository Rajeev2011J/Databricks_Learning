            - task_key: RDM_Party_CDDCase_RiskCategories
          notebook_task:
            notebook_path: ../RadarDataModel/RadarDataModel_Version2/RDM_Party_CDDCase_RiskCategories.py
          existing_cluster_id: ${var.dab_medium_cluster_id}

        - task_key: RDM_Party_CDDCase_RiskCategories_RANZ
          notebook_task:
            notebook_path: ../RadarDataModel/RDM_Party_CDDCase_RiskCategories_RANZ.py
          existing_cluster_id: ${var.dab_medium_cluster_id}

        - task_key: RDM_Party_RANZ
          notebook_task:
            notebook_path: ../RadarDataModel/RDM_Party_RANZ.py
          existing_cluster_id: ${var.dab_medium_cluster_id}

        - task_key: RANZ_RDM_Party_BusinessActivities
          depends_on:
            - task_key: RDM_CDDCase_QuestionAnswer_RANZ
          notebook_task:
            notebook_path: ../RadarDataModel/RANZ_RDM_Party_BusinessActivities.py
