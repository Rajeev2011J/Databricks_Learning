name: RDM Pytest CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - feature/*
  pull_request:
    branches:
      - main
      - develop
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  test:
    name: Run Pytest Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install Java (required for PySpark)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
      
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements-test.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements-test.txt
      
      - name: Run unit tests
        run: |
          cd tests
          pytest unit/ -v --junitxml=test-results-unit.xml --cov-report=xml:coverage-unit.xml
      
      - name: Run integration tests
        run: |
          cd tests
          pytest integration/ -v --junitxml=test-results-integration.xml --cov-report=xml:coverage-integration.xml
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: tests/test-results-*.xml
      
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: tests/coverage-*.xml
      
      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: tests/test-results-*.xml
          check_name: Test Results (Python ${{ matrix.python-version }})
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./tests/coverage-*.xml
          flags: unittests
          name: codecov-${{ matrix.python-version }}
  
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black flake8 pylint mypy
      
      - name: Run Black (code formatting check)
        run: |
          black --check tests/
      
      - name: Run Flake8 (linting)
        run: |
          flake8 tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 tests/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      
      - name: Run Pylint
        run: |
          pylint tests/ --disable=C,R || true
  
  coverage-threshold:
    name: Check Coverage Threshold
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements-test.txt
      
      - name: Run all tests with coverage
        run: |
          cd tests
          pytest --cov=../ --cov-report=term-missing --cov-fail-under=80
      
      - name: Generate coverage badge
        run: |
          coverage-badge -o coverage.svg

  databricks-integration:
    name: Databricks Integration Test
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Databricks CLI
        run: |
          pip install databricks-cli
      
      - name: Configure Databricks CLI
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          echo "[DEFAULT]" > ~/.databrickscfg
          echo "host = $DATABRICKS_HOST" >> ~/.databrickscfg
          echo "token = $DATABRICKS_TOKEN" >> ~/.databrickscfg
      
      - name: Upload test artifacts to Databricks
        run: |
          databricks workspace import_dir tests/ /Users/${{ secrets.DATABRICKS_USER }}/tests --overwrite
      
      - name: Run tests on Databricks cluster (optional)
        run: |
          echo "Tests uploaded to Databricks workspace"
          # Optionally trigger a Databricks job to run tests
          # databricks jobs run-now --job-id <job-id>