          notebook_task:
            notebook_path: ../RadarDataModel/RDM_Party_Documents.py
          existing_cluster_id: ${var.dab_medium_cluster_id}

        - task_key: RDM_Party_Selection
          depends_on:
            - task_key: RDM_Party_SystemIdentifier
          notebook_task:
            notebook_path: ../RadarDataModel/RDM_Party_Selection.py
          existing_cluster_id: ${var.dab_medium_cluster_id}
        
        - task_key: RDM_Party_KN1Cases
          notebook_task:
            notebook_path: ../RadarDataModel/RDM_Party_KN1Cases.py
          existing_cluster_id: ${var.dab_medium_cluster_id}

        - task_key: RDM_Party_AlternativeNames
          depends_on:
            - task_key: RDM_Party_SystemIdentifier
          notebook_task:
            notebook_path: ../RadarDataModel/RDM_Party_AlternativeNames.py
          existing_cluster_id: ${var.dab_medium_cluster_id}

        - task_key: RDM_Party_RadarKeyStore
          notebook_task:
