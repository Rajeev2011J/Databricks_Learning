# The main job for sira

variables:
  med_cluster_id:
    description: Cluster ID for the given name 
    lookup:
      cluster: "radar-medium"
  # trigger_paused_status: 
  #   description: PAUSED OR UNPAUSED
  #   default: PAUSED
# reference this as: existing_cluster_id: ${var.med_cluster_id}


resources:
  jobs:
    sira_job:
      name: sira_job

      permissions:
        - level: CAN_MANAGE
          user_name: mattia.didone@rabobank.com
        - level: CAN_MANAGE
          user_name: lucija.marjanovic@rabobank.nl
        - level: CAN_MANAGE
          user_name: casey.wong@rabobank.nl

      health:
        rules:
          - metric: RUN_DURATION_SECONDS
            op: GREATER_THAN
            value: 3000

      schedule:
        quartz_cron_expression: 0 0 8 ? * *
        timezone_id: Europe/Amsterdam
        pause_status: ${var.BUNDLE_VAR_trigger_pause_status}

      email_notifications:
        on_failure:
          - mattia.didone@rabobank.com
          - fm.nl.utrecht.kycdataadmin@rabobank.com
        # on_duration_warning_threshold_exceeded:
        #   - mattia.didone@rabobank.com
        #   - fm.nl.utrecht.kycdataadmin@rabobank.com
          
      tasks:
        - task_key: sira_createtable__weekly
          notebook_task:
            notebook_path: ../src/sira_createtable__weekly.py
          existing_cluster_id: ${var.med_cluster_id}

        - task_key: sira_new_questions_check__weekly
          notebook_task:
            notebook_path: ../src/sira_new_questions_check__weekly.py
          existing_cluster_id: ${var.med_cluster_id}
          depends_on:
            - task_key: sira_createtable__weekly
        
      queue:
        enabled: true
