      jobs:
        MI_Reporting_job:
          name: MI_Reporting_job
          job_clusters:
            - job_cluster_key: medium_spot_cluster
              new_cluster:
                spark_version: 14.3.x-scala2.12
                autoscale:
                  min_workers: 2
                  max_workers: 4
                node_type_id: Standard_D16ads_v5
                azure_attributes:
                  first_on_demand: 1
                  availability: SPOT_WITH_FALLBACK_AZURE
                  spot_bid_max_price: -1
                init_scripts:
                  - workspace:
                      destination: /live/clusters/files/clusters_library.sh
                spark_env_vars:
                  PYSPARK_PYTHON: ((PYSPARK_PYTHON_VALUE))
                  APP_REG_APP_ID: ((APP_REG_APP_ID_VALUE))
                  GDP_STORAGE_NAME: ((GDP_STORAGE_NAME_VALUE))
                  TENANT_ID: ((TENANT_ID_VALUE))
                  ENV: ((ENV_VALUE))
                  DATAVERSE_URL: ((DATAVERSE_URL_VALUE))
                  subscriptionId: ((subscriptionId_VALUE))
                  resourceGroup_API: ((resourceGroup_API_VALUE))
                  CosmosAccount: ((CosmosAccount_VALUE))
                  GNS_STORAGE_ACCOUNT: ((GNS_STORAGE_ACCOUNT_VALUE))
                  GNS_CONTAINER: ((GNS_CONTAINER_VALUE))
                  GDP_SA_STORAGE_NAME: ((GDP_SA_STORAGE_NAME_VALUE))
                  GDP_NA_STORAGE_NAME: ((GDP_NA_STORAGE_NAME_VALUE))
                  SALZReadStorage: ((SALZReadStorage_VALUE))
                  job_list: ((job_list_Value))
                  AU_GDP_Defined_Storage_Account: ((AU_GDP_Defined_Storage_Account_VALUE))
                  NEXUSCLOUD_USERNAME: ((NEXUSCLOUD_USERNAME_VALUE))
                  NEXUSCLOUD_PASSWORD: ((NEXUSCLOUD_PASSWORD_VALUE))
                  CATALOG: ((CATALOG_VALUE))
                enable_elastic_disk: true
                data_security_mode: NONE
                runtime_engine: PHOTON

          # - job_cluster_key: medium_spot_uc_cluster
          #   new_cluster:
          #     spark_version: 17.3.x-scala2.13
