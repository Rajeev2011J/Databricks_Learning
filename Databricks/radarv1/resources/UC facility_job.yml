# The main job for facility

variables:
  UC_cluster_id:
    description: Cluster ID for the given name 
    lookup:
      cluster: "Radar-small-UC"    

  # trigger_paused_status: 
  #   description: PAUSED OR UNPAUSED
  #   default: PAUSED
# reference this as: existing_cluster_id: ${var.UC_cluster_id}


resources:
  jobs:
    UC_facility_job:
      name: UC_facility_job

      permissions:
        - group_name: eu.aut.AADFecRadarAnalyticsEngineerWrTribe.us
          level: CAN_MANAGE_RUN

      health:
        rules:
          - metric: RUN_DURATION_SECONDS
            op: GREATER_THAN
            value: 3000

      schedule:
        quartz_cron_expression: 0 0 23 ? * 7 *
        timezone_id: Europe/Amsterdam
        pause_status: ${var.BUNDLE_VAR_trigger_pause_status}

      email_notifications:
        on_failure:
          - ruud.van.laar@rabobank.com
        # on_duration_warning_threshold_exceeded:
        #   - mattia.didone@rabobank.com
        #   - fm.nl.utrecht.kycdataadmin@rabobank.com
          
      tasks:
        - task_key: UC_facility_limit_breach_createtable__saturday
          notebook_task:
            notebook_path: ../src/UC_facility_limit_breach_createtable__daily.py
          existing_cluster_id: ${var.UC_cluster_id} 
          libraries:
            - whl: ${var.wheel_path[0]}
            - whl: ${var.wheel_path[1]}
            - whl: ${var.wheel_path[2]}
            - whl: ${var.wheel_path[3]}
            - whl: ${var.wheel_path[4]}
            - whl: ${var.wheel_path[5]}
        
      queue:
        enabled: true
