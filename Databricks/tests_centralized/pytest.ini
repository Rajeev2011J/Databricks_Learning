[pytest]
# Pytest configuration for centralized DAB testing

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test* *Test
python_functions = test_*

# Test paths
testpaths = unit integration

# Minimum version
minversion = 7.0

# Options
addopts = 
    -v
    --tb=short
    --strict-markers
    --color=yes
    -ra
    --cov=.
    --cov-report=html:coverage_report
    --cov-report=term-missing
    --maxfail=3

# Markers for organizing tests
markers =
    unit: Unit tests for bundle configuration validation
    integration: Integration tests that interact with Databricks workspace
    smoke: Quick smoke tests to verify basic functionality
    slow: Tests that take significant time to run
    adhoc_requests: Tests for AdHocRequests bundle
    party_catalog: Tests for PartyCatalog bundle
    radarv1: Tests for radarv1 bundle
    clusters: Tests for clusters bundle
    gcob_consumer: Tests for GCOB_Consumer bundle
    gcob_reportingv1: Tests for GCOB_Reportingv1 bundle
    validation: YAML and config validation tests
    deployment: Bundle deployment tests
    permissions: Permission verification tests
    resources: Resource configuration tests
    dev: Tests for dev environment
    preprod: Tests for preprod environment
    prod: Tests for prod environment

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage settings
[coverage:run]
source = .
omit = 
    */tests/*
    */test_*
    */__pycache__/*
    */site-packages/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
