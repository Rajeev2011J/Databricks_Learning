      tags:
        Asset Bundle: ""
      queue:
        enabled: true

targets:
  prod:
    default: true
    resources:
      jobs:
        radardatamodel_job:
          name: radardatamodel_job
          schedule:
            quartz_cron_expression: '0 45 6 * * ?'
            timezone_id: Europe/Amsterdam

          email_notifications:
            on_failure:
              - ruud.van.laar@rabobank.com
              - fm.global.KYCReportingSupport@rabobank.com
  preprd:
    default: true
    resources:
      jobs:
        radardatamodel_job:
          name: radardatamodel_job
          schedule:
            quartz_cron_expression: '0 45 7 * * ?'
            timezone_id: Europe/Amsterdam
  dev:
    default: true
    resources:
      jobs:
        radardatamodel_job:
      jobs:
        radardatamodel_job:
          name: radardatamodel_job
          schedule:
            quartz_cron_expression: '0 45 6 * * ?'
            timezone_id: Europe/Amsterdam