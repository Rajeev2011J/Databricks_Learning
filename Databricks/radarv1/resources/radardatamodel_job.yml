# The job for RadarDataModel dataobjects
variables:
  dab_medium_cluster_id:
    description: Cluster ID for the given name 
    lookup:
      cluster: "DAB-medium"
# reference this as: existing_cluster_id: ${var.med_cluster_id}

resources:
  jobs:
    radardatamodel_job:
      name: radardatamodel_job

      permissions:
        - level: CAN_MANAGE
          user_name: mattia.didone@rabobank.com
        - level: CAN_MANAGE
          user_name: lucija.marjanovic@rabobank.nl
        - level: CAN_MANAGE
          user_name: casey.wong@rabobank.nl
          
      schedule:
        quartz_cron_expression:  0 45 6 * * ?
        timezone_id: Europe/Amsterdam
        pause_status: UNPAUSED

      tasks:
        - task_key: RDM_Party
          depends_on:
            - task_key: RDM_Party_SystemIdentifier
            - task_key: RDM_Party_KN1Cases
          notebook_task:
            notebook_path: ../RadarDataModel/RDM_Party.py
          existing_cluster_id: ${var.dab_medium_cluster_id}

        - task_key: RDM_Party_role
          depends_on:
            - task_key: RDM_Party_SystemIdentifier
            - task_key: RDM_Party_V2
          notebook_task:
            notebook_path: ../RadarDataModel/RDM_Party_role.py
          existing_cluster_id: ${var.dab_medium_cluster_id}

        - task_key: RDM_Party_V2
          depends_on:
            - task_key: RDM_Party
          notebook_task:
            notebook_path: ../RadarDataModel/RadarDataModel_Version2/RDM_Party.py
          existing_cluster_id: ${var.dab_medium_cluster_id}

        - task_key: RDM_Party_Address
          depends_on:
            - task_key: RDM_Party_SystemIdentifier
          notebook_task:
            notebook_path: ../RadarDataModel/RDM_Party_Address.py
          existing_cluster_id: ${var.dab_medium_cluster_id}
        
        - task_key: RDM_Party_Address_V2
          depends_on:
            - task_key: RDM_Party_Address
          notebook_task:
            notebook_path: ../RadarDataModel/RadarDataModel_Version2/RDM_Party_Address.py
          existing_cluster_id: ${var.dab_medium_cluster_id}

        - task_key: RDM_Party_role
          depends_on:
            - task_key: RDM_Party_SystemIdentifier
            - task_key: RDM_Party_V2
          notebook_task:
            notebook_path: ../RadarDataModel/RDM_Party_role.py
          existing_cluster_id: ${var.dab_medium_cluster_id}

        - task_key: RDM_Party_Structure
          depends_on:
            - task_key: RDM_Party_SystemIdentifier
          notebook_task:
            notebook_path: ../RadarDataModel/RDM_Party_Structure.py
          existing_cluster_id: ${var.dab_medium_cluster_id}

        - task_key: RDM_Party_Structure_V2
          depends_on:
            - task_key: RDM_Party_Structure
          notebook_task:
            notebook_path: ../RadarDataModel/RadarDataModel_Version2/RDM_Party_Structure.py
          existing_cluster_id: ${var.dab_medium_cluster_id}

        - task_key: RDM_Party_SystemIdentifier
          notebook_task:
            notebook_path: ../RadarDataModel/RDM_Party_SystemIdentifier.py
          existing_cluster_id: ${var.dab_medium_cluster_id}

        - task_key: RDM_Internal_SystemComparison
          notebook_task:
            notebook_path: ../RadarDataModel/RDM_Internal_SystemComparison.py
          existing_cluster_id: ${var.dab_medium_cluster_id}

        - task_key: RDM_CDDCase_GRAM
          depends_on:
            - task_key: RDM_Party_SystemIdentifier
            - task_key: RDM_Party_KN1Cases
          notebook_task:
            notebook_path: ../RadarDataModel/RDM_CDDCase_GRAM.py
          existing_cluster_id: ${var.dab_medium_cluster_id}
        
        - task_key: RDM_CDDCase_GRAM_V2
