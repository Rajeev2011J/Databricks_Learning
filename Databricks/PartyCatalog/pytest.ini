# PartyCatalog/pytest.ini
#
# Per-bundle pytest configuration for LOCAL single-bundle runs:
#   cd Databricks/PartyCatalog
#   pytest
#
# For the full centralized suite (all bundles), run from Databricks/:
#   pytest                   (uses pyproject.toml automatically)
#   .\run_tests.ps1          (Windows)
#   ./run_tests.sh           (Linux / macOS / ADO CI)
#
# HOW THIS FILE INTERACTS WITH pyproject.toml
# --------------------------------------------
# When pytest is invoked from INSIDE PartyCatalog/ this file takes effect.
# When pytest is invoked from Databricks/ the pyproject.toml takes effect
# and this file is ignored.
#
# NOTE: PartyCatalog tests are marked @pytest.mark.local_only and are
# skipped automatically on Databricks clusters (IS_DATABRICKS=True).
# They validate databricks.yml, variables.yml, and resources/schemas.yml
# structure against expected Unity Catalog schema definitions.

[pytest]
testpaths = tests

# src/ for this bundle + shared infrastructure from the parent tests/ dir
pythonpath =
    src
    ../tests

addopts =
    --tb=short
    -v
    --strict-markers
    --import-mode=importlib
